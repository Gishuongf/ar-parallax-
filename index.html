<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AR Параллакс</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                         Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ===== Экран загрузки ===== */
        #overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: #fff;
            padding: 30px;
            text-align: center;
        }

        #overlay.hidden {
            display: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #overlay h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        #overlay .subtitle {
            color: #999;
            font-size: 14px;
            line-height: 1.5;
            max-width: 300px;
        }

        #start-btn {
            margin-top: 24px;
            padding: 16px 50px;
            font-size: 17px;
            font-weight: 600;
            background: #34c759;
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: none;
            -webkit-tap-highlight-color: transparent;
        }

        #start-btn:active {
            background: #2da44e;
            transform: scale(0.97);
        }

        #start-btn:disabled {
            background: #555;
        }

        #status {
            margin-top: 16px;
            font-size: 13px;
            color: #777;
            max-width: 300px;
            line-height: 1.5;
        }

        #error-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.4);
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 13px;
            max-width: 320px;
            text-align: left;
            line-height: 1.6;
        }

        #error-box b {
            color: #ff4444;
        }

        /* ===== Подсказка ===== */
        #hint {
            position: fixed;
            top: max(env(safe-area-inset-top, 12px), 12px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 9999;
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.6s;
            white-space: nowrap;
        }

        #hint.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="overlay">
        <div class="spinner" id="spinner"></div>
        <h2>AR Параллакс</h2>
        <p class="subtitle">Наведите камеру на картину, чтобы увидеть эффект глубины</p>
        <button id="start-btn">Запустить AR</button>
        <div id="status">Проверка...</div>
        <div id="error-box"></div>
    </div>

    <!-- Подсказка -->
    <div id="hint" class="hidden">📷 Наведите на картину</div>

    <!-- ============================================== -->
    <!--  БИБЛИОТЕКА: локальный файл из репозитория     -->
    <!--  Файл mindar-image-three.prod.js должен лежать -->
    <!--  в корне репозитория рядом с index.html        -->
    <!--  НЕ добавляйте отдельный Three.js — он внутри  -->
    <!-- ============================================== -->
    <script src="mindar-image-three.prod.js"></script>

    <script>
    (function () {
        'use strict';

        // =============================================
        //  НАСТРОЙКИ — ИЗМЕНИТЕ ПОД СВОЙ ПРОЕКТ
        // =============================================
        var CFG = {
            // Скомпилированный файл целевого изображения
            targetsFile: 'targets.mind',

            // Индекс изображения в .mind (0 = первое)
            targetIndex: 0,

            // Пути к параллакс-слоям
            layers: {
                back:  'images/layer-back.png',
                mid:   'images/layer-mid.png',
                front: 'images/layer-front.png'
            },

            // Соотношение сторон картины (ширина / высота)
            // Например: картина 80×60 см → 80/60 = 1.33
            aspectRatio: 1.33,

            // Глубина слоёв (отрицательное = дальше)
            zDepth: {
                back:  -0.06,
                mid:   -0.03,
                front:  0.0
            },

            // Увеличение слоёв (задний больше для параллакса)
            layerScale: {
                back:  1.40,
                mid:   1.20,
                front: 1.02
            },

            // Сила параллакса
            parallax: {
                back:  0.025,
                mid:   0.012,
                front: 0.0
            },

            // Ширина рамки в 3D-единицах
            frameWidth: 1.0
        };

        // =============================================
        //  DOM-ЭЛЕМЕНТЫ
        // =============================================
        var overlay  = document.getElementById('overlay');
        var spinner  = document.getElementById('spinner');
        var startBtn = document.getElementById('start-btn');
        var statusEl = document.getElementById('status');
        var errorBox = document.getElementById('error-box');
        var hintEl   = document.getElementById('hint');

        function setStatus(msg) {
            statusEl.textContent = msg;
            console.log('[AR]', msg);
        }

        function showError(msg) {
            spinner.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = msg;
            setStatus('Ошибка');
        }

        // =============================================
        //  ПРОВЕРКИ
        // =============================================
        function checkAll() {
            var errors = [];

            // 1. MindAR
            if (typeof window.MINDAR === 'undefined') {
                errors.push(
                    '❌ <b>MindAR не загрузился</b><br>' +
                    'Убедитесь что файл <b>mindar-image-three.prod.js</b> ' +
                    'лежит в корне репозитория рядом с index.html'
                );
            } else if (typeof window.MINDAR.IMAGE === 'undefined') {
                errors.push(
                    '❌ MindAR загружен, но модуль IMAGE отсутствует.<br>' +
                    'Возможно, скачан неправильный файл. ' +
                    'Нужен именно <b>mindar-image-three.prod.js</b>'
                );
            } else if (typeof window.MINDAR.IMAGE.MindARThree === 'undefined') {
                errors.push(
                    '❌ MindAR.IMAGE.MindARThree не найден.<br>' +
                    'Файл повреждён или неполный.'
                );
            }

            // 2. Three.js (должен быть внутри MindAR)
            if (typeof window.THREE === 'undefined') {
                errors.push(
                    '❌ <b>Three.js не найден</b><br>' +
                    'Он должен быть встроен в mindar-image-three.prod.js'
                );
            }

            // 3. Камера
            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {
                errors.push(
                    '❌ <b>Камера недоступна</b><br>' +
                    'Протокол: <b>' + location.protocol + '</b><br>' +
                    'Нужен <b>HTTPS</b>. ' +
                    'Проверьте настройки GitHub Pages.'
                );
            }

            // 4. WebGL
            try {
                var c = document.createElement('canvas');
                var gl = c.getContext('webgl') ||
                         c.getContext('experimental-webgl');
                if (!gl) {
                    errors.push('❌ WebGL не поддерживается');
                }
            } catch (e) {
                errors.push('❌ Ошибка WebGL: ' + e.message);
            }

            if (errors.length > 0) {
                showError(errors.join('<br><br>'));
                return false;
            }

            return true;
        }

        // =============================================
        //  ГИРОСКОП
        // =============================================
        var gyro = { x: 0, y: 0 };
        var gyroBase = null;

        function initGyroscope() {
            return new Promise(function (resolve) {
                if (typeof DeviceOrientationEvent === 'undefined') {
                    setStatus('Гироскоп не поддерживается');
                    resolve();
                    return;
                }

                // iOS 13+ требует разрешения
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(function (perm) {
                            if (perm === 'granted') {
                                listenGyro();
                                setStatus('Гироскоп активен');
                            } else {
                                setStatus('Гироскоп не разрешён');
                            }
                            resolve();
                        })
                        .catch(function () {
                            setStatus('Ошибка гироскопа');
                            resolve();
                        });
                } else {
                    listenGyro();
                    resolve();
                }
            });
        }

        function listenGyro() {
            window.addEventListener('deviceorientation', function (e) {
                if (e.gamma === null) return;

                if (!gyroBase) {
                    gyroBase = {
                        beta:  e.beta  || 0,
                        gamma: e.gamma || 0
                    };
                }

                var gx = ((e.gamma || 0) - gyroBase.gamma) / 30;
                var gy = ((e.beta  || 0) - gyroBase.beta)  / 30;

                gyro.x = Math.max(-1, Math.min(1, gx));
                gyro.y = Math.max(-1, Math.min(1, gy));
            }, true);
        }

        // =============================================
        //  ЗАГРУЗКА ТЕКСТУРЫ
        // =============================================
        function loadTexture(url, THREE) {
            return new Promise(function (resolve, reject) {
                var loader = new THREE.TextureLoader();
                loader.load(
                    url,
                    function (tex) {
                        tex.minFilter = THREE.LinearFilter;
                        tex.magFilter = THREE.LinearFilter;
                        resolve(tex);
                    },
                    undefined,
                    function () {
                        reject(new Error(url));
                    }
                );
            });
        }

        // =============================================
        //  ГЛАВНАЯ ФУНКЦИЯ
        // =============================================
        function launchAR() {
            setStatus('Проверка файлов...');

            if (!checkAll()) return;

            setStatus('Инициализация AR...');

            var MINDAR = window.MINDAR;
            var THREE  = window.THREE;

            // --- Создание MindAR ---
            var mindarThree;
            try {
                mindarThree = new MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: CFG.targetsFile,
                    filterMinCF: 0.001,
                    filterBeta: 10,
                    uiLoading: 'no',
                    uiScanning: 'no',
                    uiError: 'no'
                });
            } catch (e) {
                showError(
                    'Ошибка создания MindAR:<br><b>' + e.message + '</b>'
                );
                return;
            }

            var renderer = mindarThree.renderer;
            var scene    = mindarThree.scene;
            var camera   = mindarThree.camera;

            if (!renderer) {
                showError('Renderer не создан. Попробуйте другой браузер.');
                return;
            }

            var gl = renderer.getContext();
            gl.enable(gl.STENCIL_TEST);

            setStatus('Загрузка слоёв...');

            // --- Загрузка всех текстур ---
            Promise.all([
                loadTexture(CFG.layers.back,  THREE),
                loadTexture(CFG.layers.mid,   THREE),
                loadTexture(CFG.layers.front, THREE)
            ]).then(function (textures) {

                setStatus('Построение сцены...');

                var texBack  = textures[0];
                var texMid   = textures[1];
                var texFront = textures[2];

                var fw = CFG.frameWidth;
                var fh = fw / CFG.aspectRatio;

                // --- Якорь (привязка к изображению) ---
                var anchor = mindarThree.addAnchor(CFG.targetIndex);
                var artGroup = new THREE.Group();
                anchor.group.add(artGroup);

                // --- Стенсил-маска (невидимая рамка) ---
                var maskGeo = new THREE.PlaneGeometry(fw, fh);
                var maskMat = new THREE.MeshBasicMaterial({
                    colorWrite: false,
                    depthWrite: false,
                    stencilWrite: true,
                    stencilRef: 1,
                    stencilFunc: THREE.AlwaysStencilFunc,
                    stencilZPass: THREE.ReplaceStencilOp
                });
                var maskMesh = new THREE.Mesh(maskGeo, maskMat);
                maskMesh.position.z = 0.005;
                maskMesh.renderOrder = 0;
                artGroup.add(maskMesh);

                // --- Создание слоя ---
                function makeLayer(tex, name, renderOrder) {
                    var w = fw * CFG.layerScale[name];
                    var h = fh * CFG.layerScale[name];
                    var geo = new THREE.PlaneGeometry(w, h);
                    var mat = new THREE.MeshBasicMaterial({
                        map: tex,
                        transparent: true,
                        side: THREE.FrontSide,
                        depthWrite: false,
                        stencilWrite: false,
                        stencilRef: 1,
                        stencilFunc: THREE.EqualStencilFunc
                    });
                    var mesh = new THREE.Mesh(geo, mat);
                    mesh.position.z = CFG.zDepth[name];
                    mesh.renderOrder = renderOrder;
                    artGroup.add(mesh);
                    return mesh;
                }

                var meshBack  = makeLayer(texBack,  'back',  1);
                var meshMid   = makeLayer(texMid,   'mid',   2);
                var meshFront = makeLayer(texFront,  'front', 3);

                // --- Декоративная рамка ---
                var bw = 0.015;
                var bMat = new THREE.MeshBasicMaterial({
                    color: 0x1c1c1e,
                    side: THREE.FrontSide
                });

                function addFrame(x, y, w, h) {
                    var m = new THREE.Mesh(
                        new THREE.PlaneGeometry(w, h), bMat
                    );
                    m.position.set(x, y, 0.006);
                    m.renderOrder = 10;
                    artGroup.add(m);
                }

                addFrame(0,  fh / 2 + bw / 2, fw + bw * 2, bw);
                addFrame(0, -fh / 2 - bw / 2, fw + bw * 2, bw);
                addFrame(-fw / 2 - bw / 2, 0, bw, fh);
                addFrame( fw / 2 + bw / 2, 0, bw, fh);

                // --- События трекинга ---
                var isTracking = false;

                anchor.onTargetFound = function () {
                    isTracking = true;
                    hintEl.textContent = '🎨 Наклоняйте телефон!';
                    hintEl.classList.remove('hidden');
                };

                anchor.onTargetLost = function () {
                    isTracking = false;
                    hintEl.textContent = '📷 Наведите на картину';
                    hintEl.classList.remove('hidden');
                };

                // --- Запуск камеры ---
                setStatus('Запуск камеры...');

                mindarThree.start().then(function () {

                    overlay.classList.add('hidden');
                    hintEl.classList.remove('hidden');

                    // --- Рендер-цикл ---
                    renderer.setAnimationLoop(function () {
                        if (isTracking) {
                            meshBack.position.x =
                                 gyro.x * CFG.parallax.back;
                            meshBack.position.y =
                                -gyro.y * CFG.parallax.back;

                            meshMid.position.x =
                                 gyro.x * CFG.parallax.mid;
                            meshMid.position.y =
                                -gyro.y * CFG.parallax.mid;

                            meshFront.position.x =
                                 gyro.x * CFG.parallax.front;
                            meshFront.position.y =
                                -gyro.y * CFG.parallax.front;
                        }

                        gl.enable(gl.STENCIL_TEST);
                        renderer.render(scene, camera);
                    });

                }).catch(function (e) {
                    showError(
                        'Не удалось запустить камеру:<br><b>' +
                        e.message + '</b><br><br>' +
                        'Убедитесь что:<br>' +
                        '• Сайт открыт через <b>HTTPS</b><br>' +
                        '• Вы разрешили доступ к камере<br>' +
                        '• Камера не занята другим приложением'
                    );
                });

            }).catch(function (e) {
                showError(
                    'Не удалось загрузить слой:<br><b>' +
                    e.message + '</b><br><br>' +
                    'Проверьте что файл существует в репозитории ' +
                    'и путь указан правильно.'
                );
            });
        }

        // =============================================
        //  ТОЧКА ВХОДА
        // =============================================
        window.addEventListener('DOMContentLoaded', function () {

            // Даём браузеру время загрузить локальный JS-файл
            setTimeout(function () {

                var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

                if (isIOS) {
                    // iOS: нужен тап для камеры + гироскопа
                    spinner.style.display = 'none';
                    startBtn.style.display = 'block';
                    setStatus('Нажмите кнопку для запуска');

                    startBtn.addEventListener('click', function () {
                        startBtn.disabled = true;
                        startBtn.textContent = 'Запуск...';

                        initGyroscope().then(function () {
                            launchAR();
                        });
                    }, { once: true });

                } else {
                    // Android: запускаем сразу
                    initGyroscope().then(function () {
                        launchAR();
                    });
                }

            }, 300);
        });

    })();
    </script>
</body>
</html>
