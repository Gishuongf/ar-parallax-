<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR Параллакс</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, sans-serif;
        }

        #overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10000; color: #fff;
            padding: 30px; text-align: center;
        }
        #overlay.hidden { display: none; }

        .spinner {
            width: 44px; height: 44px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #start-btn {
            margin-top: 24px;
            padding: 16px 50px;
            font-size: 17px; font-weight: 600;
            background: #34c759; color: #fff;
            border: none; border-radius: 14px;
            cursor: pointer; display: none;
        }
        #start-btn:active { background: #2da44e; }
        #start-btn:disabled { background: #555; }

        #status {
            margin-top: 16px;
            font-size: 13px; color: #777;
            max-width: 300px; line-height: 1.5;
        }

        #error-box {
            display: none; margin-top: 16px;
            padding: 16px;
            background: rgba(255,59,48,0.15);
            border: 1px solid rgba(255,59,48,0.4);
            border-radius: 12px;
            color: #ff6b6b; font-size: 13px;
            max-width: 320px; text-align: left; line-height: 1.6;
        }

        #hint {
            position: fixed;
            top: max(env(safe-area-inset-top, 12px), 12px);
            left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff; padding: 10px 24px;
            border-radius: 25px; font-size: 14px;
            z-index: 9999; pointer-events: none;
            transition: opacity 0.6s;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="spinner" id="spinner"></div>
        <h2 style="margin-bottom:8px;">AR Параллакс</h2>
        <p style="color:#999;font-size:14px;">
            Наведите камеру на картину
        </p>
        <button id="start-btn">Запустить AR</button>
        <div id="status">Проверка...</div>
        <div id="error-box"></div>
    </div>

    <div id="hint" class="hidden">📷 Наведите на картину</div>

    <!-- ============================================ -->
    <!--  ПОРЯДОК ВАЖЕН!                              -->
    <!--  1. Сначала Three.js                         -->
    <!--  2. Потом MindAR (он использует Three.js)     -->
    <!-- ============================================ -->
    <script src="three.min.js"></script>
    <script src="mindar-image.prod.js"></script>

    <script>
    (function () {
        'use strict';

        // =============================================
        //  НАСТРОЙКИ
        // =============================================
        var CFG = {
            targetsFile: 'targets.mind',
            targetIndex: 0,
            layers: {
                back:  'images/layer-back.png',
                mid:   'images/layer-mid.png',
                front: 'images/layer-front.png'
            },
            aspectRatio: 1.33,
            zDepth:     { back: -0.06, mid: -0.03, front: 0.0 },
            layerScale: { back: 1.40,  mid: 1.20,  front: 1.02 },
            parallax:   { back: 0.025, mid: 0.012,  front: 0.0 },
            frameWidth: 1.0
        };

        // =============================================
        //  DOM
        // =============================================
        var overlay  = document.getElementById('overlay');
        var spinner  = document.getElementById('spinner');
        var startBtn = document.getElementById('start-btn');
        var statusEl = document.getElementById('status');
        var errorBox = document.getElementById('error-box');
        var hintEl   = document.getElementById('hint');

        function setStatus(msg) {
            statusEl.textContent = msg;
            console.log('[AR]', msg);
        }

        function showError(msg) {
            spinner.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = msg;
            setStatus('Ошибка');
        }

        // =============================================
        //  ПРОВЕРКИ
        // =============================================
        function checkAll() {
            var errors = [];

            if (typeof window.THREE === 'undefined') {
                errors.push(
                    '❌ <b>Three.js не найден</b><br>' +
                    'Проверьте что файл <b>three.min.js</b> ' +
                    'лежит в корне репозитория'
                );
            }

            if (typeof window.MINDAR === 'undefined') {
                errors.push(
                    '❌ <b>MindAR не найден</b><br>' +
                    'Проверьте что файл <b>mindar-image.prod.js</b> ' +
                    'лежит в корне репозитория'
                );
            } else if (typeof window.MINDAR.IMAGE === 'undefined') {
                errors.push(
                    '❌ MindAR загружен, но модуль IMAGE отсутствует'
                );
            } else if (typeof window.MINDAR.IMAGE.MindARThree === 'undefined') {
                errors.push(
                    '❌ MindARThree не найден в MindAR'
                );
            }

            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {
                errors.push(
                    '❌ <b>Камера недоступна</b><br>' +
                    'Протокол: <b>' + location.protocol + '</b><br>' +
                    'Нужен <b>HTTPS</b>'
                );
            }

            if (errors.length > 0) {
                showError(errors.join('<br><br>'));
                return false;
            }
            return true;
        }

        // =============================================
        //  ГИРОСКОП
        // =============================================
        var gyro = { x: 0, y: 0 };
        var gyroBase = null;

        function initGyroscope() {
            return new Promise(function (resolve) {
                if (typeof DeviceOrientationEvent === 'undefined') {
                    setStatus('Гироскоп не поддерживается');
                    resolve();
                    return;
                }

                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(function (perm) {
                            if (perm === 'granted') {
                                listenGyro();
                            } else {
                                setStatus('Гироскоп не разрешён');
                            }
                            resolve();
                        })
                        .catch(function () {
                            setStatus('Ошибка гироскопа');
                            resolve();
                        });
                } else {
                    listenGyro();
                    resolve();
                }
            });
        }

        function listenGyro() {
            window.addEventListener('deviceorientation', function (e) {
                if (e.gamma === null) return;
                if (!gyroBase) {
                    gyroBase = { beta: e.beta || 0, gamma: e.gamma || 0 };
                }
                gyro.x = Math.max(-1, Math.min(1,
                    ((e.gamma || 0) - gyroBase.gamma) / 30));
                gyro.y = Math.max(-1, Math.min(1,
                    ((e.beta || 0) - gyroBase.beta) / 30));
            }, true);
        }

        // =============================================
        //  ЗАГРУЗКА ТЕКСТУРЫ
        // =============================================
        function loadTexture(url) {
            return new Promise(function (resolve, reject) {
                var loader = new THREE.TextureLoader();
                loader.load(
                    url,
                    function (tex) {
                        tex.minFilter = THREE.LinearFilter;
                        tex.magFilter = THREE.LinearFilter;
                        resolve(tex);
                    },
                    undefined,
                    function () { reject(new Error(url)); }
                );
            });
        }

        // =============================================
        //  ЗАПУСК AR
        // =============================================
        function launchAR() {
            setStatus('Проверка файлов...');
            if (!checkAll()) return;

            setStatus('Инициализация AR...');

            var mindarThree;
            try {
                mindarThree = new MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: CFG.targetsFile,
                    filterMinCF: 0.001,
                    filterBeta: 10,
                    uiLoading: 'no',
                    uiScanning: 'no',
                    uiError: 'no'
                });
            } catch (e) {
                showError('Ошибка MindAR:<br><b>' + e.message + '</b>');
                return;
            }

            var renderer = mindarThree.renderer;
            var scene    = mindarThree.scene;
            var camera   = mindarThree.camera;

            if (!renderer) {
                showError('Renderer не создан');
                return;
            }

            var gl = renderer.getContext();
            gl.enable(gl.STENCIL_TEST);

            setStatus('Загрузка слоёв...');

            Promise.all([
                loadTexture(CFG.layers.back),
                loadTexture(CFG.layers.mid),
                loadTexture(CFG.layers.front)
            ]).then(function (textures) {

                setStatus('Построение сцены...');

                var fw = CFG.frameWidth;
                var fh = fw / CFG.aspectRatio;

                var anchor = mindarThree.addAnchor(CFG.targetIndex);
                var artGroup = new THREE.Group();
                anchor.group.add(artGroup);

                // Стенсил-маска
                var maskGeo = new THREE.PlaneGeometry(fw, fh);
                var maskMat = new THREE.MeshBasicMaterial({
                    colorWrite: false,
                    depthWrite: false,
                    stencilWrite: true,
                    stencilRef: 1,
                    stencilFunc: THREE.AlwaysStencilFunc,
                    stencilZPass: THREE.ReplaceStencilOp
                });
                var maskMesh = new THREE.Mesh(maskGeo, maskMat);
                maskMesh.position.z = 0.005;
                maskMesh.renderOrder = 0;
                artGroup.add(maskMesh);

                // Слои
                function makeLayer(tex, name, order) {
                    var w = fw * CFG.layerScale[name];
                    var h = fh * CFG.layerScale[name];
                    var geo = new THREE.PlaneGeometry(w, h);
                    var mat = new THREE.MeshBasicMaterial({
                        map: tex,
                        transparent: true,
                        side: THREE.FrontSide,
                        depthWrite: false,
                        stencilWrite: false,
                        stencilRef: 1,
                        stencilFunc: THREE.EqualStencilFunc
                    });
                    var mesh = new THREE.Mesh(geo, mat);
                    mesh.position.z = CFG.zDepth[name];
                    mesh.renderOrder = order;
                    artGroup.add(mesh);
                    return mesh;
                }

                var meshBack  = makeLayer(textures[0], 'back',  1);
                var meshMid   = makeLayer(textures[1], 'mid',   2);
                var meshFront = makeLayer(textures[2], 'front', 3);

                // Рамка
                var bw = 0.015;
                var bMat = new THREE.MeshBasicMaterial({ color: 0x1c1c1e });

                function addFrame(x, y, w, h) {
                    var m = new THREE.Mesh(
                        new THREE.PlaneGeometry(w, h), bMat
                    );
                    m.position.set(x, y, 0.006);
                    m.renderOrder = 10;
                    artGroup.add(m);
                }

                addFrame(0,  fh/2 + bw/2, fw + bw*2, bw);
                addFrame(0, -fh/2 - bw/2, fw + bw*2, bw);
                addFrame(-fw/2 - bw/2, 0, bw, fh);
                addFrame( fw/2 + bw/2, 0, bw, fh);

                // Трекинг
                var isTracking = false;

                anchor.onTargetFound = function () {
                    isTracking = true;
                    hintEl.textContent = '🎨 Наклоняйте телефон!';
                    hintEl.classList.remove('hidden');
                };

                anchor.onTargetLost = function () {
                    isTracking = false;
                    hintEl.textContent = '📷 Наведите на картину';
                    hintEl.classList.remove('hidden');
                };

                // Запуск
                setStatus('Запуск камеры...');

                mindarThree.start().then(function () {
                    overlay.classList.add('hidden');
                    hintEl.classList.remove('hidden');

                    renderer.setAnimationLoop(function () {
                        if (isTracking) {
                            meshBack.position.x =
                                 gyro.x * CFG.parallax.back;
                            meshBack.position.y =
                                -gyro.y * CFG.parallax.back;

                            meshMid.position.x =
                                 gyro.x * CFG.parallax.mid;
                            meshMid.position.y =
                                -gyro.y * CFG.parallax.mid;

                            meshFront.position.x =
                                 gyro.x * CFG.parallax.front;
                            meshFront.position.y =
                                -gyro.y * CFG.parallax.front;
                        }
                        gl.enable(gl.STENCIL_TEST);
                        renderer.render(scene, camera);
                    });
                }).catch(function (e) {
                    showError(
                        'Камера не запустилась:<br><b>' +
                        e.message + '</b><br><br>' +
                        '• Сайт должен быть на <b>HTTPS</b><br>' +
                        '• Разрешите доступ к камере'
                    );
                });

            }).catch(function (e) {
                showError(
                    'Не загружен слой:<br><b>' + e.message + '</b><br><br>' +
                    'Проверьте папку images/ в репозитории'
                );
            });
        }

        // =============================================
        //  ТОЧКА ВХОДА
        // =============================================
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

                if (isIOS) {
                    spinner.style.display = 'none';
                    startBtn.style.display = 'block';
                    setStatus('Нажмите кнопку для запуска');

                    startBtn.addEventListener('click', function () {
                        startBtn.disabled = true;
                        startBtn.textContent = 'Запуск...';
                        initGyroscope().then(function () {
                            launchAR();
                        });
                    }, { once: true });
                } else {
                    initGyroscope().then(function () {
                        launchAR();
                    });
                }
            }, 300);
        });

    })();
    </script>
</body>
</html>
