<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AR Параллакс</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, sans-serif;
        }

        #overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10000; color: #fff;
            padding: 30px; text-align: center;
        }
        #overlay.hidden { display: none; }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #start-btn {
            margin-top: 20px;
            padding: 16px 50px;
            font-size: 17px; font-weight: 600;
            background: #34c759; color: #fff;
            border: none; border-radius: 14px;
            cursor: pointer;
            display: none;
        }

        #status {
            margin-top: 15px;
            font-size: 13px; color: #888;
            max-width: 300px; line-height: 1.5;
        }

        #error-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,59,48,0.2);
            border: 1px solid #ff3b30;
            border-radius: 10px;
            color: #ff6b6b;
            font-size: 13px;
            max-width: 320px;
            text-align: left;
            line-height: 1.5;
        }

        #hint {
            position: fixed;
            top: max(env(safe-area-inset-top, 10px), 10px);
            left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff; padding: 10px 22px;
            border-radius: 25px; font-size: 14px;
            z-index: 9999; pointer-events: none;
            backdrop-filter: blur(10px);
            transition: opacity 0.6s;
        }
        #hint.hidden { opacity: 0; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="spinner" id="spinner"></div>
        <h2 style="margin-bottom:8px;">AR Параллакс</h2>
        <p style="color:#aaa;font-size:14px;">
            Наведите камеру на картину
        </p>
        <button id="start-btn">Запустить AR</button>
        <div id="status">Проверка совместимости...</div>
        <div id="error-box"></div>
    </div>

    <div id="hint" class="hidden">📷 Наведите на картину</div>

    <!-- ============================================ -->
    <!--  ЗАГРУЗКА БИБЛИОТЕК                          -->
    <!--  ВАЖНО: только ОДИН скрипт MindAR!           -->
    <!--  НЕ добавляйте отдельный Three.js — он уже   -->
    <!--  встроен в mindar-image-three                -->
    <!-- ============================================ -->
    <script src="mindar-image-three.prod.js"></script>

    <script>
    (function () {
        'use strict';

        // =============================================
        //  Элементы интерфейса
        // =============================================
        const overlay   = document.getElementById('overlay');
        const spinner   = document.getElementById('spinner');
        const startBtn  = document.getElementById('start-btn');
        const statusEl  = document.getElementById('status');
        const errorBox  = document.getElementById('error-box');
        const hintEl    = document.getElementById('hint');

        function setStatus(msg) {
            statusEl.textContent = msg;
            console.log('[AR]', msg);
        }

        function showError(msg) {
            spinner.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.innerHTML = msg;
            setStatus('Ошибка');
        }

        // =============================================
        //  ПРОВЕРКА 1: Загрузился ли MindAR?
        // =============================================
        function checkMindAR() {
            // Проверяем все уровни вложенности
            if (typeof window.MINDAR === 'undefined') {
                return 'Библиотека MindAR не загрузилась.<br>' +
                       'Проверьте интернет-соединение.';
            }
            if (typeof window.MINDAR.IMAGE === 'undefined') {
                return 'MindAR загрузился, но модуль IMAGE отсутствует.';
            }
            if (typeof window.MINDAR.IMAGE.MindARThree === 'undefined') {
                return 'MindAR.IMAGE.MindARThree не найден.<br>' +
                       'Возможно, CDN вернул старую версию.';
            }
            return null; // всё ок
        }

        // =============================================
        //  ПРОВЕРКА 2: Доступна ли камера?
        // =============================================
        function checkCamera() {
            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {
                return 'Камера недоступна.<br>' +
                       'Убедитесь что сайт открыт через <b>HTTPS</b>.<br>' +
                       'Текущий протокол: <b>' +
                       location.protocol + '</b>';
            }
            return null;
        }

        // =============================================
        //  ПРОВЕРКА 3: Поддерживается ли WebGL?
        // =============================================
        function checkWebGL() {
            try {
                const c = document.createElement('canvas');
                const gl = c.getContext('webgl') ||
                           c.getContext('experimental-webgl');
                if (!gl) return 'WebGL не поддерживается на этом устройстве.';
                return null;
            } catch (e) {
                return 'Ошибка WebGL: ' + e.message;
            }
        }

        // =============================================
        //  Запуск всех проверок
        // =============================================
        function runChecks() {
            const errors = [];

            const e1 = checkMindAR();
            if (e1) errors.push('❌ ' + e1);

            const e2 = checkCamera();
            if (e2) errors.push('❌ ' + e2);

            const e3 = checkWebGL();
            if (e3) errors.push('❌ ' + e3);

            if (errors.length > 0) {
                showError(errors.join('<br><br>'));
                return false;
            }

            setStatus('Всё готово!');
            return true;
        }

        // =============================================
        //  Гироскоп
        // =============================================
        const gyro = { x: 0, y: 0 };
        let gyroBase = null;

        async function initGyroscope() {
            if (typeof DeviceOrientationEvent === 'undefined') {
                setStatus('Гироскоп не поддерживается');
                return;
            }

            // iOS 13+
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') {
                        setStatus('Гироскоп не разрешён');
                        return;
                    }
                } catch (e) {
                    setStatus('Ошибка гироскопа: ' + e.message);
                    return;
                }
            }

            window.addEventListener('deviceorientation', function (e) {
                if (e.gamma === null) return;
                if (!gyroBase) {
                    gyroBase = { beta: e.beta || 0, gamma: e.gamma || 0 };
                }
                var gx = ((e.gamma || 0) - gyroBase.gamma) / 30;
                var gy = ((e.beta || 0) - gyroBase.beta) / 30;
                gyro.x = Math.max(-1, Math.min(1, gx));
                gyro.y = Math.max(-1, Math.min(1, gy));
            }, true);
        }

        // =============================================
        //  НАСТРОЙКИ ПРОЕКТА
        // =============================================
        var CFG = {
            targetsFile: 'targets.mind',
            targetIndex: 0,
            layers: {
                back:  'images/layer-back.png',
                mid:   'images/layer-mid.png',
                front: 'images/layer-front.png'
            },
            aspectRatio: 1.33,
            zDepth:      { back: -0.06, mid: -0.03, front: 0.0 },
            layerScale:  { back: 1.40,  mid: 1.20,  front: 1.02 },
            parallax:    { back: 0.025, mid: 0.012, front: 0.0 },
            frameWidth:  1.0
        };

        // =============================================
        //  Главная функция запуска AR
        // =============================================
        async function launchAR() {
            setStatus('Инициализация MindAR...');

            // Ещё раз проверяем перед запуском
            var err = checkMindAR();
            if (err) {
                showError(err);
                return;
            }

            // --- Создание MindAR ---
            var mindarThree;
            try {
                mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: CFG.targetsFile,
                    filterMinCF: 0.001,
                    filterBeta: 10,
                    uiLoading: 'no',
                    uiScanning: 'no',
                    uiError: 'no'
                });
            } catch (e) {
                showError('Ошибка создания MindAR:<br>' + e.message);
                return;
            }

            var renderer = mindarThree.renderer;
            var scene    = mindarThree.scene;
            var camera   = mindarThree.camera;

            // Проверяем что renderer создался
            if (!renderer) {
                showError('Renderer не создан. Попробуйте другой браузер.');
                return;
            }

            var gl = renderer.getContext();
            gl.enable(gl.STENCIL_TEST);

            setStatus('Загрузка изображений...');

            // --- Загрузка текстур ---
            var THREE = window.THREE;
            if (!THREE) {
                showError('Three.js не найден. MindAR должен включать его автоматически.');
                return;
            }

            var texLoader = new THREE.TextureLoader();

            function loadTex(url) {
                return new Promise(function (resolve, reject) {
                    texLoader.load(
                        url,
                        function (tex) {
                            tex.minFilter = THREE.LinearFilter;
                            tex.magFilter = THREE.LinearFilter;
                            resolve(tex);
                        },
                        undefined,
                        function () {
                            reject(new Error(url));
                        }
                    );
                });
            }

            var textures;
            try {
                textures = {
                    back:  await loadTex(CFG.layers.back),
                    mid:   await loadTex(CFG.layers.mid),
                    front: await loadTex(CFG.layers.front)
                };
            } catch (e) {
                showError('Не удалось загрузить изображение:<br><b>' +
                          e.message + '</b><br><br>' +
                          'Проверьте что файл существует в репозитории ' +
                          'по правильному пути.');
                return;
            }

            setStatus('Построение сцены...');

            // --- Построение параллакс-картины ---
            var fw = CFG.frameWidth;
            var fh = fw / CFG.aspectRatio;
            var anchor = mindarThree.addAnchor(CFG.targetIndex);
            var artGroup = new THREE.Group();
            anchor.group.add(artGroup);

            // Маска (стенсил)
            var maskGeo = new THREE.PlaneGeometry(fw, fh);
            var maskMat = new THREE.MeshBasicMaterial({
                colorWrite: false,
                depthWrite: false,
                stencilWrite: true,
                stencilRef: 1,
                stencilFunc: THREE.AlwaysStencilFunc,
                stencilZPass: THREE.ReplaceStencilOp
            });
            var maskMesh = new THREE.Mesh(maskGeo, maskMat);
            maskMesh.position.z = 0.005;
            maskMesh.renderOrder = 0;
            artGroup.add(maskMesh);

            // Слои
            var layerMeshes = {};
            var layerNames = ['back', 'mid', 'front'];

            layerNames.forEach(function (name) {
                var w = fw * CFG.layerScale[name];
                var h = fh * CFG.layerScale[name];
                var geo = new THREE.PlaneGeometry(w, h);
                var mat = new THREE.MeshBasicMaterial({
                    map: textures[name],
                    transparent: true,
                    side: THREE.FrontSide,
                    depthWrite: false,
                    stencilWrite: false,
                    stencilRef: 1,
                    stencilFunc: THREE.EqualStencilFunc
                });
                var mesh = new THREE.Mesh(geo, mat);
                mesh.position.z = CFG.zDepth[name];
                mesh.renderOrder = name === 'back' ? 1 :
                                   name === 'mid' ? 2 : 3;
                layerMeshes[name] = mesh;
                artGroup.add(mesh);
            });

            // Рамка
            var bw = 0.015;
            var bMat = new THREE.MeshBasicMaterial({ color: 0x1c1c1e });

            function addFrame(x, y, w, h) {
                var m = new THREE.Mesh(
                    new THREE.PlaneGeometry(w, h), bMat
                );
                m.position.set(x, y, 0.006);
                m.renderOrder = 10;
                artGroup.add(m);
            }

            addFrame(0,  fh/2 + bw/2, fw + bw*2, bw);
            addFrame(0, -fh/2 - bw/2, fw + bw*2, bw);
            addFrame(-fw/2 - bw/2, 0, bw, fh);
            addFrame( fw/2 + bw/2, 0, bw, fh);

            // --- События трекинга ---
            var isTracking = false;

            anchor.onTargetFound = function () {
                isTracking = true;
                hintEl.textContent = '🎨 Наклоняйте телефон!';
                hintEl.classList.remove('hidden');
            };

            anchor.onTargetLost = function () {
                isTracking = false;
                hintEl.textContent = '📷 Наведите на картину';
                hintEl.classList.remove('hidden');
            };

            // --- Запуск ---
            setStatus('Запуск камеры...');

            try {
                await mindarThree.start();
            } catch (e) {
                showError('Не удалось запустить камеру:<br>' +
                          e.message + '<br><br>' +
                          'Убедитесь что:<br>' +
                          '• Сайт открыт через HTTPS<br>' +
                          '• Камера разрешена<br>' +
                          '• Камера не занята');
                return;
            }

            overlay.classList.add('hidden');
            hintEl.classList.remove('hidden');

            // --- Рендер-цикл ---
            renderer.setAnimationLoop(function () {
                if (isTracking) {
                    layerNames.forEach(function (name) {
                        var mesh = layerMeshes[name];
                        var str = CFG.parallax[name];
                        mesh.position.x =  gyro.x * str;
                        mesh.position.y = -gyro.y * str;
                    });
                }
                gl.enable(gl.STENCIL_TEST);
                renderer.render(scene, camera);
            });
        }

        // =============================================
        //  Точка входа
        // =============================================
        window.addEventListener('DOMContentLoaded', function () {
            // Даём CDN время загрузиться
            setTimeout(function () {
                var ok = runChecks();
                if (!ok) return;

                var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

                if (isIOS) {
                    spinner.style.display = 'none';
                    startBtn.style.display = 'block';
                    setStatus('Нажмите кнопку для запуска');

                    startBtn.addEventListener('click', async function () {
                        startBtn.disabled = true;
                        startBtn.textContent = 'Запуск...';
                        await initGyroscope();
                        await launchAR();
                    }, { once: true });
                } else {
                    initGyroscope().then(function () {
                        launchAR();
                    });
                }
            }, 500); // 500мс на загрузку CDN
        });

    })();
    </script>
</body>
</html>
